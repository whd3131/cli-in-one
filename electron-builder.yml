appId: com.dorian.cliinone
productName: CLI in One
npmRebuild: false

directories:
  output: release

files:
  - package.json
  - CHANGELOG.md
  - src/main.js
  - src/preload.js
  - src/shared/**/*
  - static/favicon.ico
  - static/image-tools.html
  - dist/renderer/**/*
  - "!node_modules/node-addon-api/**/*"
  - "!node_modules/node-pty/build/**/*"
  - "!node_modules/node-pty/deps/**/*"
  - "!node_modules/node-pty/prebuilds/win32-arm64/**/*"
  - "!node_modules/node-pty/scripts/**/*"
  - "!node_modules/node-pty/src/**/*"
  - "!node_modules/node-pty/third_party/**/*"

asarUnpack:
  - node_modules/node-pty/**/*
  - "**/*.node"

win:
  icon: static/favicon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: cli-in-one-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CLI in One

portable:
  artifactName: cli-in-one-${version}-windows-${arch}-portable.${ext}

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  artifactName: cli-in-one-${version}-mac-${arch}.${ext}
