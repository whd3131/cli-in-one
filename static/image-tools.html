<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CLI in One Image Tools</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7fb;
        --panel: #ffffff;
        --text: #172033;
        --muted: #667085;
        --line: #d7dce8;
        --accent: #2563eb;
        --accent-fg: #ffffff;
        --shadow: rgba(15, 23, 42, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101318;
          --panel: #171b22;
          --text: #f2f5fa;
          --muted: #a2adbd;
          --line: #2a3240;
          --accent: #60a5fa;
          --accent-fg: #08111f;
          --shadow: rgba(0, 0, 0, 0.34);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        letter-spacing: 0;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        box-shadow: 0 8px 24px var(--shadow);
      }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
      }

      .header-copy {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        padding: 14px;
      }

      .tool {
        display: grid;
        grid-template-rows: auto minmax(420px, calc((100vh - 112px) / 2));
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 14px 34px var(--shadow);
      }

      .tool-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-width: 0;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }

      h2 {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        font-size: 14px;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      a {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        padding: 0 10px;
        border-radius: 7px;
        background: var(--accent);
        color: var(--accent-fg);
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        text-decoration: none;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #ffffff;
      }

      @media (max-width: 960px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .grid {
          grid-template-columns: minmax(0, 1fr);
        }

        .tool {
          grid-template-rows: auto 560px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-copy">
        <h1>CLI in One Image Tools</h1>
        <p class="subtitle">Embedded helper tools for background removal and image conversion.</p>
      </div>
    </header>

    <main class="grid">
      <section class="tool">
        <div class="tool-header">
          <h2>remove.bg</h2>
          <a href="https://www.remove.bg/zh" target="_blank" rel="noopener noreferrer">Open</a>
        </div>
        <iframe src="https://www.remove.bg/zh" title="remove.bg" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-read; clipboard-write"></iframe>
      </section>

      <section class="tool">
        <div class="tool-header">
          <h2>TinyPNG</h2>
          <a href="https://tinypng.com/cn/" target="_blank" rel="noopener noreferrer">Open</a>
        </div>
        <iframe src="https://tinypng.com/cn/" title="TinyPNG" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-read; clipboard-write"></iframe>
      </section>

      <section class="tool">
        <div class="tool-header">
          <h2>PNG to WebP</h2>
          <a href="https://picflow.com/convert/png-to-webp" target="_blank" rel="noopener noreferrer">Open</a>
        </div>
        <iframe src="https://picflow.com/convert/png-to-webp" title="PNG to WebP" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-read; clipboard-write"></iframe>
      </section>

      <section class="tool">
        <div class="tool-header">
          <h2>PNG to ICO</h2>
          <a href="https://picflow.com/convert/png-to-ico" target="_blank" rel="noopener noreferrer">Open</a>
        </div>
        <iframe src="https://picflow.com/convert/png-to-ico" title="PNG to ICO" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-read; clipboard-write"></iframe>
      </section>
    </main>
  </body>
</html>
