name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Version, changelog, and GitHub release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  windows-artifacts:
    name: Build Windows release artifacts
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist:win

      - name: Upload installers to GitHub Release
        shell: pwsh
        run: |
          $tag = "${{ needs.release-please.outputs.tag_name }}"
          $assetPaths = Get-ChildItem -Path release -File |
            Where-Object { $_.Extension -in ".exe", ".blockmap" } |
            ForEach-Object { $_.FullName }

          if (-not $assetPaths) {
            throw "No release artifacts found in release/."
          }

          gh release upload $tag @assetPaths --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-artifacts:
    name: Build macOS release artifacts (${{ matrix.arch }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS artifacts
        shell: bash
        run: |
          cleanup_dmg_mounts() {
            hdiutil info | awk '/\/Volumes\/CLI in One/ { print $1 }' | while read -r device; do
              hdiutil detach "$device" -force || true
            done
          }

          npm run build:renderer
          npx electron-builder --mac zip --${{ matrix.arch }} --publish never

          if [ "${{ matrix.arch }}" = "x64" ]; then
            dmg_built=false
            for attempt in 1 2 3; do
              if npx electron-builder --mac dmg --${{ matrix.arch }} --publish never; then
                dmg_built=true
                break
              fi
              cleanup_dmg_mounts
              sleep 10
            done

            if [ "$dmg_built" != "true" ]; then
              echo "x64 DMG build failed after retries; continuing with ZIP artifacts." >&2
            fi
          else
            npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
          fi

      - name: Upload macOS artifacts to GitHub Release
        shell: bash
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(find release -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.blockmap" \))

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No macOS release artifacts found in release/." >&2
            exit 1
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
