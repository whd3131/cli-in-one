name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Version, changelog, and GitHub release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  windows-artifacts:
    name: Build Windows release artifacts
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist:win

      - name: Upload installers to GitHub Release
        shell: pwsh
        run: |
          $tag = "${{ needs.release-please.outputs.tag_name }}"
          $assetPaths = Get-ChildItem -Path release -File |
            Where-Object { $_.Extension -in ".exe", ".blockmap" } |
            ForEach-Object { $_.FullName }

          if (-not $assetPaths) {
            throw "No release artifacts found in release/."
          }

          gh release upload $tag @assetPaths --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
