name: Release Artifacts

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-artifacts:
    name: Build Windows release artifacts
    runs-on: windows-latest

    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "value=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          } elseif ("${{ github.event_name }}" -eq "push") {
            "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=${{ github.event.release.tag_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist:win

      - name: Build release notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.value }}"
          $version = $tag -replace '^v', ''
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $lines = Get-Content -Path CHANGELOG.md
          $headingPattern = "^## \[$([regex]::Escape($version))\]"
          $start = -1

          for ($index = 0; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match $headingPattern) {
              $start = $index + 1
              break
            }
          }

          $notes = @()
          if ($start -ge 0) {
            for ($index = $start; $index -lt $lines.Count; $index++) {
              if ($lines[$index] -match '^## \[') {
                break
              }

              $notes += $lines[$index]
            }
          }

          if (-not ($notes | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })) {
            $notes = @("Release $tag", "", "See CHANGELOG.md for details.")
          }

          Set-Content -Path $notesPath -Value $notes -Encoding UTF8
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Ensure GitHub Release exists
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.value }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes-file "${{ steps.notes.outputs.notes_path }}" --latest
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers to GitHub Release
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.value }}"
          $assetPaths = Get-ChildItem -Path release -File |
            Where-Object { $_.Extension -in ".exe", ".blockmap" } |
            ForEach-Object { $_.FullName }

          if (-not $assetPaths) {
            throw "No release artifacts found in release/."
          }

          gh release upload $tag @assetPaths --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-artifacts:
    name: Build macOS release artifacts (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS artifacts
        shell: bash
        run: |
          cleanup_dmg_mounts() {
            hdiutil info | awk '/\/Volumes\/CLI in One/ { print $1 }' | while read -r device; do
              hdiutil detach "$device" -force || true
            done
          }

          npm run build:renderer
          npx electron-builder --mac zip --${{ matrix.arch }} --publish never

          if [ "${{ matrix.arch }}" = "x64" ]; then
            dmg_built=false
            for attempt in 1 2 3; do
              if npx electron-builder --mac dmg --${{ matrix.arch }} --publish never; then
                dmg_built=true
                break
              fi
              cleanup_dmg_mounts
              sleep 10
            done

            if [ "$dmg_built" != "true" ]; then
              echo "x64 DMG build failed after retries; continuing with ZIP artifacts." >&2
            fi
          else
            npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
          fi

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.value }}"
          version="${tag#v}"
          notes_path="$RUNNER_TEMP/release-notes.md"

          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { in_section=1; next }
            in_section && $0 ~ "^## \\[" { exit }
            in_section { print }
          ' CHANGELOG.md > "$notes_path"

          if ! grep -q '[^[:space:]]' "$notes_path"; then
            {
              echo "Release $tag"
              echo
              echo "See CHANGELOG.md for details."
            } > "$notes_path"
          fi

          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub Release exists
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.value }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes-file "${{ steps.notes.outputs.notes_path }}" --latest || gh release view "$tag"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts to GitHub Release
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.value }}"
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(find release -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.blockmap" \))

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No macOS release artifacts found in release/." >&2
            exit 1
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
